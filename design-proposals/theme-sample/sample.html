<!-- sample.html -->
<!-- Theme: Aosa Wave (custom, theme-factory) — 青さで挑む.jpg の配色をもとに作成 -->
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>週次プロジェクトレポート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --midnight-indigo: #0b064b;  /* 本文・小見出し */
    --deep-ocean:      #011c6b;  /* 帯グラデーション（始点） */
    --challenge-blue:  #0150c5;  /* 小見出しの線 */
    --wave-blue:       #016ad5;  /* 帯グラデーション（終点） */
    --mist-lavender:   #cdd7ed;  /* 本文パネル */
    --spark-red:       #fd0018;  /* 差し色：大見出し下の線のみ */

    --font-heading: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    --font-body:    "Noto Sans JP", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  }

  body {
    margin: 0;
    background: #ffffff;
    color: var(--midnight-indigo);
    font-family: var(--font-body);
    font-weight: 400;
    line-height: 1.8;
  }

  /* 上部の帯：深い藍から明るい青へ流れる波 */
  header {
    position: relative;
    overflow: hidden;
    padding: 64px 16px 96px;
    background: linear-gradient(120deg, var(--deep-ocean) 0%, var(--challenge-blue) 55%, var(--wave-blue) 100%);
  }

  /* 波の光の筋 */
  header::before {
    content: "";
    position: absolute;
    inset: -40% -10%;
    background: repeating-linear-gradient(
      -12deg,
      rgba(255, 255, 255, 0) 0 14px,
      rgba(255, 255, 255, 0.07) 14px 17px,
      rgba(255, 255, 255, 0) 17px 30px
    );
    transform: skewY(-4deg);
    pointer-events: none;
  }

  header h1,
  main {
    position: relative;
    max-width: 720px;
    margin: 0 auto;
  }

  h1 {
    color: #ffffff;
    font-family: var(--font-heading);
    font-weight: 700;
    font-size: 2.2rem;
    line-height: 1.3;
    letter-spacing: 0.04em;
  }

  h1::after {
    content: "";
    display: block;
    width: 72px;
    height: 3px;
    margin-top: 16px;
    background: var(--spark-red);
  }

  /* 本文パネル：帯の下端に重ねて配置 */
  main {
    margin-top: -48px;
    padding: 0 16px 64px;
  }

  .panel {
    padding: 32px 32px 16px;
    background: var(--mist-lavender);
  }

  h2 {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 32px 0 8px;
    color: var(--midnight-indigo);
    font-family: var(--font-heading);
    font-weight: 700;
    font-size: 1.3rem;
  }

  h2:first-child {
    margin-top: 0;
  }

  h2::before {
    content: "";
    flex: none;
    width: 24px;
    height: 4px;
    background: var(--challenge-blue);
  }

  p {
    margin: 0 0 16px;
  }

  @media (max-width: 480px) {
    .panel {
      padding: 24px 20px 8px;
    }
  }
</style>
</head>
<body>
<header>
<h1>週次プロジェクトレポート</h1>
</header>
<main>
<div class="panel">
<h2>進捗サマリー</h2>
<p>今週のスプリントでは、認証モジュールの実装を完了しました。</p>
<h2>来週の計画</h2>
<p>APIインテグレーションのテストを開始します。</p>
</div>
</main>
</body>
</html>
